<div class="forgot-container">
  <div class="glass-card forgot-card">
    <div class="brand">
      <div class="logo">A</div>
      <h1>Recuperar Senha</h1>
      <p *ngIf="step === 1 && !isFinalSuccess">Informe seu e-mail para recuperar sua senha</p>
      <p *ngIf="step === 2 && !isFinalSuccess">Insira o código enviado e sua nova senha</p>
      <p *ngIf="isFinalSuccess">Pronto! Sua senha foi alterada</p>
    </div>

    <div *ngIf="successMsg" class="alert-success">{{ successMsg }}</div>
    <div *ngIf="errorMsg" class="alert-error">{{ errorMsg }}</div>

    <!-- Step 1: Request Recovery -->
    <form [formGroup]="formStep1" (ngSubmit)="submitEmail()" *ngIf="step === 1 && !isFinalSuccess">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" formControlName="email" placeholder="seu@email.com">
      </div>

      <button type="submit" class="btn-primary forgot-btn" [disabled]="formStep1.invalid || isLoading">
        {{ isLoading ? 'Enviando...' : 'Confirmar' }}
      </button>
    </form>

    <!-- Step 2: Confirm Recovery -->
    <form [formGroup]="formStep2" (ngSubmit)="submitRecovery()" *ngIf="step === 2 && !isFinalSuccess">
      <div class="form-group">
        <label for="code">Código de Verificação</label>
        <input type="text" id="code" formControlName="code" placeholder="123456" maxlength="6">
        <small *ngIf="devCode" style="color: var(--accent-primary); display: block; margin-top: 0.25rem;">
          Código de teste recebido: <strong>{{ devCode }}</strong>
        </small>
      </div>

      <div class="form-group">
        <label for="newPassword">Nova Senha</label>
        <input type="password" id="newPassword" formControlName="newPassword" placeholder="••••••••">
      </div>

      <button type="submit" class="btn-primary forgot-btn" [disabled]="formStep2.invalid || isLoading">
        {{ isLoading ? 'Redefinindo...' : 'Alterar Senha' }}
      </button>
    </form>

    <p class="login-link">
      <a routerLink="/login">Voltar para o Login</a>
    </p>
  </div>
</div>
