<div class="forgot-container">
  <div class="glass-card forgot-card">
    <div class="brand">
      <div class="logo">A</div>
      <h1>Esqueceu a senha?</h1>
      <p>Informe seu e-mail para recuperar sua senha</p>
    </div>

    <div *ngIf="successMsg" class="alert-success">{{ successMsg }}</div>
    <div *ngIf="errorMsg" class="alert-error">{{ errorMsg }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()" *ngIf="!successMsg">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" formControlName="email" placeholder="seu@email.com">
      </div>

      <button type="submit" class="btn-primary forgot-btn" [disabled]="form.invalid || isLoading">
        {{ isLoading ? 'Enviando...' : 'Confirmar' }}
      </button>
    </form>

    <p class="login-link">
      <a routerLink="/login">Voltar para o Login</a>
    </p>
  </div>
</div>
